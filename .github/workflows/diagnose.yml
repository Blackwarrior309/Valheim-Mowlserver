# Lag-Diagnose: aktuellen Spielstand vom Server holen und auswerten (nur lesen). Ergebnis als Hinweis „Lag-Diagnose“ am Lauf.
name: Lag-Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'Blackwarrior309/Valheim-welt' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # gleicher Zwischenspeicher wie die Live-Karte (kennt den Weltordner, nur lesen – wird hier nicht gespeichert)
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sync-data
          key: sync-${{ github.run_id }}
          restore-keys: sync-
      - name: Spielstand holen
        env:
          VS_FTP_HOST: ${{ secrets.VS_FTP_HOST }}
          VS_FTP_PORT: ${{ secrets.VS_FTP_PORT }}
          VS_FTP_USER: ${{ secrets.VS_FTP_USER }}
          VS_FTP_PASSWORD: ${{ secrets.VS_FTP_PASSWORD }}
          VS_FTP_DIR: ${{ secrets.VS_FTP_DIR }}
          VS_WORLD: ${{ secrets.VS_WORLD }}
          VS_STRIP_IDS: 'true'
          VS_DATA: ${{ runner.temp }}/sync-data
          VS_OUT: ${{ runner.temp }}/diag.vwelt
        run: node sync/sync.cjs > "$RUNNER_TEMP/sync.log" 2>&1 || true
      - name: Auswerten
        run: |
          if ! node sync/diagnose.cjs "$RUNNER_TEMP/sync-data/welt-cache" 2> "$RUNNER_TEMP/err.txt"; then
            # Fehler sichtbar machen (lange Zahlen wie Steam-IDs geschwärzt)
            { tail -n 15 "$RUNNER_TEMP/sync.log"; tail -n 5 "$RUNNER_TEMP/err.txt"; find "$RUNNER_TEMP/sync-data" -maxdepth 3 | head -20; } | sed -E 's/[0-9]{15,20}/***/g' | while IFS= read -r l; do echo "::warning title=Diagnose-Fehler::$l"; done
            exit 1
          fi

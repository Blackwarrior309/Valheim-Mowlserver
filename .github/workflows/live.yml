# Live-Karte: holt die Welt alle ~5 Minuten per FTP vom Server (z. B. Nitrado),
# wandelt sie um und veröffentlicht die Seite samt live/welt.vwelt auf GitHub Pages.
# Einrichtung: Settings → Secrets and variables → Actions → Secrets:
#   VS_FTP_HOST, VS_FTP_USER, VS_FTP_PASSWORD  (Pflicht)
#   VS_FTP_PORT, VS_FTP_DIR, VS_WORLD          (optional; Standard: 21, Ordner automatisch, größte Welt)
# und Settings → Pages → Source: „GitHub Actions“.
# Ohne FTP-Secrets wird nur die Webseite (ohne Live-Welt) veröffentlicht.
# Anleitung: docs/LIVE-MAP.md
name: Live-Karte

on:
  schedule:
    - cron: '*/5 * * * *'     # kürzester Abstand, den GitHub erlaubt (Läufe können sich etwas verspäten)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # Bau-Verlauf in den Branch „verlauf“ schreiben
  pages: write
  id-token: write

concurrency:
  group: live-karte
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Das Original-Repo (Template) veröffentlicht nie eine Live-Welt – nur Kopien davon
      HAS_FTP: ${{ secrets.VS_FTP_HOST != '' && github.repository != 'Blackwarrior309/Valheim-welt' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zwischenspeicher (Weltdateien, letzter Stand) – liegt außerhalb der Seite, wird nie veröffentlicht
      - uses: actions/cache/restore@v4
        if: ${{ env.HAS_FTP == 'true' }}
        with:
          path: ${{ runner.temp }}/sync-data
          key: sync-${{ github.run_id }}
          restore-keys: sync-

      # Bau-Verlauf (Zeitraffer): liegt im Branch „verlauf“ dieses Repos, nicht auf dem Server
      - name: Verlauf holen
        if: ${{ env.HAS_FTP == 'true' }}
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          D="$RUNNER_TEMP/verlauf"
          if ! git clone -q --depth 1 --branch verlauf "$REPO_URL" "$D" 2>/dev/null; then
            rm -rf "$D"; mkdir -p "$D"; cd "$D"
            git init -q -b verlauf && git remote add origin "$REPO_URL"
            echo "Neuer Verlauf wird angelegt."
          fi

      - name: Welt vom Server holen und umwandeln
        id: sync
        if: ${{ env.HAS_FTP == 'true' }}
        continue-on-error: true
        env:
          VS_FTP_HOST: ${{ secrets.VS_FTP_HOST }}
          VS_FTP_PORT: ${{ secrets.VS_FTP_PORT }}
          VS_FTP_USER: ${{ secrets.VS_FTP_USER }}
          VS_FTP_PASSWORD: ${{ secrets.VS_FTP_PASSWORD }}
          VS_FTP_DIR: ${{ secrets.VS_FTP_DIR }}
          VS_WORLD: ${{ secrets.VS_WORLD }}
          VS_DUMP_PATH: 'auto'      # Server-Mod-Datei (welt.vwdump) nehmen, falls vorhanden – sonst Spielstände
          VS_STRIP_IDS: 'true'      # Repo ist öffentlich → keine Steam-IDs
          VS_DATA: ${{ runner.temp }}/sync-data
          VS_OUT: ${{ runner.temp }}/sync-data/letzter-stand.vwelt
          VS_HISTORY: ${{ runner.temp }}/verlauf
        # bei Änderungen am Repo/manuellem Start neu umwandeln (neue Viewer-/Konverter-Version), sonst nur bei neuem Spielstand
        run: node sync/sync.cjs ${{ github.event_name != 'schedule' && '--force' || '' }}

      - name: Verlauf speichern
        if: ${{ env.HAS_FTP == 'true' && steps.sync.outputs.history == 'true' }}
        run: |
          cd "$RUNNER_TEMP/verlauf"
          git add -A
          if git diff --cached --quiet; then echo "Verlauf unverändert."; exit 0; fi
          git -c user.name="valheim-sync" -c user.email="valheim-sync@users.noreply.github.com" commit -q -m "Verlauf $(date -u +'%Y-%m-%d %H:%M')"
          git push -q origin verlauf

      - name: Letzten Stand in die Seite legen
        if: ${{ env.HAS_FTP == 'true' }}
        run: |
          if [ -f "$RUNNER_TEMP/verlauf/index.json" ]; then
            mkdir -p live/verlauf && cp -r "$RUNNER_TEMP/verlauf/index.json" "$RUNNER_TEMP/verlauf/e" live/verlauf/
            for f in tode.json spuren; do [ -e "$RUNNER_TEMP/verlauf/$f" ] && cp -r "$RUNNER_TEMP/verlauf/$f" live/verlauf/; done
          fi
          if [ -f "$RUNNER_TEMP/sync-data/letzter-stand.vwelt" ]; then
            mkdir -p live && cp "$RUNNER_TEMP/sync-data/letzter-stand.vwelt" live/welt.vwelt
            ls -la live
          else
            echo "Noch kein Stand vorhanden."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.sync.outputs.changed == 'true' || steps.sync.outputs.history == 'true' || github.event_name != 'schedule' }}
        with:
          path: .

      - id: deploy
        if: ${{ steps.sync.outputs.changed == 'true' || steps.sync.outputs.history == 'true' || github.event_name != 'schedule' }}
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000           # Maximum, das GitHub erlaubt

      # Zwischenspeicher erst nach erfolgreicher Veröffentlichung sichern –
      # schlägt sie fehl, holt der nächste Lauf die Welt neu und versucht es wieder.
      - uses: actions/cache/save@v4
        if: ${{ always() && (steps.sync.outputs.changed == 'true' || steps.sync.outputs.history == 'true') && steps.deploy.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/sync-data
          key: sync-${{ github.run_id }}

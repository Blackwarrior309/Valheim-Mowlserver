name: Viewer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/test-map-tools.cjs tools/test-multiplayer.cjs tools/test-player-card.cjs
      - run: node tools/test-graphics.cjs
      - name: JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-graphics.txt
      - run: python -m unittest discover -s tools -p 'test_graphics_export.py'

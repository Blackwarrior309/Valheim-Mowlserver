## Valheim Welt Live – settings for a dedicated server (e.g. Nitrado)
## Einstellungen für einen dedizierten Server

[Daten]

## How often the whole world is read again (seconds, min. 10). Servers: 300.
# Setting type: Int32
# Default value: 30
WorldIntervalSeconds = 300

## How often player positions are updated (seconds).
# Setting type: Single
# Default value: 1
PlayerIntervalSeconds = 5

[Live]

## Server: send player positions, health/stamina and creatures (with pet names) every few seconds to the live map's public MQTT channel (outgoing connection only). Everyone on the map can see it.
# Setting type: Boolean
# Default value: true
Enabled = true

## MQTT broker (the live map uses the same one).
# Setting type: String
# Default value: broker.emqx.io
Broker = broker.emqx.io

## MQTT port (plain TCP).
# Setting type: Int32
# Default value: 1883
Port = 1883

## Seconds between player updates.
# Setting type: Single
# Default value: 1
PlayerSeconds = 1

## Seconds between creature updates.
# Setting type: Single
# Default value: 5
CreatureSeconds = 5

[Leistung]

## World dump: at most this many objects per frame (64–65536). Smaller = smoother, dump takes longer.
# Setting type: Int32
# Default value: 2048
MaxObjectsPerFrame = 2048

## World dump: time budget per frame in milliseconds. Whichever limit is reached first ends the frame's portion.
# Setting type: Single
# Default value: 2
MaxMillisecondsPerFrame = 2

## true = gzip 'Fastest' (less CPU, slightly bigger file), false = 'Optimal'.
# Setting type: Boolean
# Default value: true
FastCompression = true

## Log one line per world dump: objects, scan time, max ms per frame, compression time, sizes, extra memory, skipped dumps.
# Setting type: Boolean
# Default value: true
LogPerformance = true

[Datei]

## Also write the world dump to a file (for FTP sync, e.g. Nitrado). Set to true on servers.
# Setting type: Boolean
# Default value: false
WriteDumpFile = true

## Empty = BepInEx/config/ValheimWeltLive/welt.vwdump
# Setting type: String
# Default value:
DumpPath =

[Datenschutz]

## Do not output Steam IDs (authors of signs/portals).
# Setting type: Boolean
# Default value: true
StripSteamIds = true

[Spuren]

## Server: record player positions for the walking heatmap (spuren-YYYYMMDD.csv next to the dump file). Only with the consent of your players.
# Setting type: Boolean
# Default value: false
RecordPositions = false

## Seconds between recorded positions.
# Setting type: Int32
# Default value: 10
PositionIntervalSeconds = 10

## Days of position files kept on the server (the live map copies them to GitHub).
# Setting type: Int32
# Default value: 3
KeepDays = 3

## Server: record every new tombstone (tode.csv next to the dump file) – also deaths whose tombstone is looted before the next save.
# Setting type: Boolean
# Default value: true
RecordDeaths = true

[Web]

## Start the built-in web page/API.
# Setting type: Boolean
# Default value: true
Enabled = false

## Port of the web page (http://localhost:PORT/).
# Setting type: Int32
# Default value: 8686
Port = 8686

## true = reachable from the network too (server/LAN). On Windows this may need admin rights or a URL reservation.
# Setting type: Boolean
# Default value: false
BindAll = false
